<section
  class="page form-page golf-form-page"
  data-page="dang-ky-golf"
  hidden
  aria-labelledby="golf-form-title"
>
  <!-- include: components/site-nav.html -->
  <!-- include: components/brand-pair.html {"className":"golf-form-branding","anniversaryAlt":"36 năm Gemadept"} -->

  <h1 id="golf-form-title" class="form-subtitle">
    <strong>ĐĂNG KÝ ĐÁNH GOLF</strong>
    <em lang="en">Golf registration</em>
  </h1>
  <form id="golf-form" class="registration-form" data-step="golf">
    <label
      >Công ty / <span lang="en">Company</span>
      <span class="required">*</span>
      <input
        name="company"
        autocomplete="organization"
        placeholder="Nhập tên công ty / Enter company name"
        required
        maxlength="160"
      />
    </label>
    <label
      >Họ &amp; tên Khách mời / <span lang="en">Guest name</span>
      <span class="required">*</span>
      <input
        name="name"
        autocomplete="name"
        placeholder="Nhập tên của bạn / Enter your name"
        required
        maxlength="120"
      />
    </label>
    <label
      >Chức vụ Khách mời / <span lang="en">Guest position</span>
      <input
        name="position"
        autocomplete="organization-title"
        placeholder="Nhập chức vụ / Enter your position"
        maxlength="120"
      />
    </label>
    <label
      >Xác nhận tham dự / <span lang="en">Attendance confirmation</span>
      <select name="attendance">
        <option value="undecided">Chưa xác định / Undecided</option>
        <option value="yes">Xác nhận tham dự / Attending</option>
        <option value="no">Xác nhận không tham dự / Not attending</option>
      </select>
    </label>
    <label
      >Size áo / <span lang="en">T-shirt size</span>
      <select name="shirtSize">
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
        <option value="XXXL">XXXL</option>
      </select>
    </label>
    <label>
      <span lang="en">Handicap</span> / <span lang="en">VGA</span>
      <textarea name="handicap" placeholder="Handicap / VGA" rows="3" maxlength="500"></textarea>
    </label>
    <p class="form-error" role="alert" hidden></p>
    <button class="confirm-button" type="submit">
      XÁC NHẬN THAM GIA / <span lang="en">CONFIRM ATTENDANCE</span>
    </button>
    <p class="form-hint privacy-note">
      Thông tin được gửi đến Ban tổ chức để xác nhận đăng ký giải golf.
    </p>
  </form>
  <img
    class="landscape"
    src="/assets/images/golf-landscape.webp"
    alt="Sân golf Tân Sơn Nhất"
    width="1440"
    height="956"
    loading="lazy"
  />
</section>
